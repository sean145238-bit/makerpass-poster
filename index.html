<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>MakerPass | Official poster</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eeeadd; color: #12372d; font-family: "Helvetica Neue", Arial, sans-serif; }
    header { border-bottom: 1px solid #c7cbbd; background: #faf6eb; }
    .bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .9rem 2rem; max-width: 58rem; margin: auto; padding: 1rem clamp(1rem, 4vw, 2rem); }
    h1 { margin: 0; font-size: clamp(1.1rem, 3.5vw, 1.45rem); letter-spacing: -.02em; }
    h1 span { color: #b14c2a; }
    nav { display: flex; flex-wrap: wrap; gap: .45rem 1.1rem; align-items: center; }
    nav a { font-weight: 650; font-size: .93rem; padding: .6rem .15rem; color: #164334; text-underline-offset: .2em; }
    .demo { display: inline-block; background: #153c31; color: white; border-radius: .35rem; padding: .65rem .85rem; text-decoration: none; }
    a:focus-visible { outline: 3px solid #b14c2a; outline-offset: 3px; }
    main { max-width: 58rem; margin: 0 auto; padding: clamp(.65rem, 3vw, 2rem) clamp(.5rem, 4vw, 2rem); }
    picture, img { display: block; }
    img { width: 100%; height: auto; }
    @page { size: A3 portrait; margin: 0; }
    @media print { header { display: none; } body, main { width: 297mm; max-width: none; margin: 0; padding: 0; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>MakerPass<span>.</span></h1>
      <nav aria-label="Poster and live demo">
        <a href="./makerpass-poster.png" download="MakerPass-poster-A3.png">Download A3 poster</a>
        <a class="demo" href="https://sean145238-sean.ms.show/">Try MakerPass ↗</a>
      </nav>
    </div>
  </header>
  <main>
    <picture>
      <source media="print" srcset="./makerpass-poster.png">
      <img src="./preview.webp" width="1440" height="2036" fetchpriority="high" alt="MakerPass helps makers read Chinese open hardware in English. The poster labels the USB-C Power Delivery input on a mini hot plate. Explore 51 open-source repositories across 9 hardware categories.">
    </picture>
  </main>
